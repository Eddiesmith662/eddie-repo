<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>VSPEED Overlay</title>
<script>/* report this page's errors to the overlay's log file (data/logs) */
(function () { let n = 0; const page = 'overlay';
  function rep(msg, src, line) { if (++n > 20) return; try { fetch('/api/clientlog', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ page, msg: String(msg), src: src || '', line: line || '' }) }).catch(() => {}); } catch (e) {} }
  window.addEventListener('error', e => rep(e.message, e.filename, e.lineno));
  window.addEventListener('unhandledrejection', e => rep('Unhandled: ' + ((e.reason && e.reason.message) || e.reason)));
})();</script>
<style>
  :root {
    --red: #FF0D40;
    --grey: #383839;        /* 92% grey */
    --grey80: rgba(0,0,0,.74);        /* widget bodies: dark, see-through (rows alternate with --grey80b) */
    --grey80b: rgba(17,17,17,.89);
    --poscol: rgba(0,0,0,.88);        /* position column */
    --blue: #33A1FF;
    --midgrey: #939598;
    --black: #0b0b0c;
    --yellow: #FFE81F;
    --green: #22C55E;
    --row: 34px;
    /* the Windows font is spelled "Bahnschrift"; SemiBold = weight 600, Light = weight 300 */
    --semi: "Bahnschrift SemiBold", "Bahnschrift", Arial, sans-serif;
    --light: "Bahnschrift Light", "Bahnschrift", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font-family: var(--semi); font-weight: 600; color: #fff; position: relative; }
  body.preview { background: #555 url("/static/assets/preview_bg.jpg") center/cover; }

  .widget { position: absolute; }
  .widget.off { visibility: hidden; }
  /* light sweep used by the in-animations (same idea as the standings / race info / team boxes) */
  .shine { position: absolute; top: 0; bottom: 0; left: 0; width: 140px; pointer-events: none; opacity: 0; z-index: 3;
           background: linear-gradient(100deg, transparent, rgba(255,255,255,.22), transparent); }

  /* ---------- Top left logo ---------- */
  #logo { top: 30px; left: 40px; transform-origin: left; }
  #logo .plate {
    position: relative; overflow: hidden;
    width: 330px; height: 72px; background: var(--grey);
    transform: skewX(-14deg); transform-origin: left bottom; display: flex; align-items: center; justify-content: center;
    box-shadow: 5px 5px 0 var(--black), 0 4px 18px rgba(0,0,0,.35);   /* hard black drop shadow along the bottom and right */
  }
  #logo .plate img { height: 34px; transform: skewX(14deg); }
  /* straight (non-slanted) version, picked by right-clicking the VSPEED logo tile */
  #logo.straight .plate, #logo.straight .plate img, #logo.straight .accent { transform: none; }
  #logo .accent { height: 5px; width: 330px; transform: skewX(-14deg); transform-origin: left top; position: relative; }
  #logo .accent::after { content: ""; position: absolute; left: 0; top: 0; height: 100%; width: 38%; background: var(--red); }

  /* ---------- Top right league ---------- */
  #league { top: 30px; right: 40px; display: flex; flex-direction: column; align-items: center; }
  #league img { max-height: 92px; max-width: 220px; display: block; filter: drop-shadow(0 3px 10px rgba(0,0,0,.4)); }
  #league .tag {
    margin-top: 6px; min-width: 120px; padding: 3px 18px; text-align: center;
    font-size: 18px; letter-spacing: 2px; text-transform: uppercase;
    background: var(--red); color: #fff; transition: background .3s, color .3s;
  }
  #league .tag.replay { background: var(--blue); color: #fff; }

  /* ---------- Timing tower ---------- */
  #tower { top: 120px; left: 40px; width: 330px; }
  #tower .head {
    background: var(--grey); padding: 10px 14px 9px; font-size: 21px; text-transform: uppercase;
    letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative;
  }
  #tower .head::after { content: ""; position: absolute; left: 0; bottom: 0; height: 4px; width: 55%; background: var(--red); transform-origin: left; }
  #tower .sub {
    background: var(--black); display: flex; align-items: center; justify-content: space-between;
    padding: 6px 14px; font-family: var(--light); font-weight: 300; font-size: 17px; letter-spacing: 1px; text-transform: uppercase;
  }
  #tower .sub .flag { width: 18px; height: 18px; border-radius: 3px; background: transparent; transition: background .3s; }
  /* the red accent under the ticker header follows the track state (caution, white, checkered, red flag) */
  #tower.f-caution .head::after, #tower.f-pace .head::after { background: var(--yellow); }
  #tower.f-white .head::after { background: #fff; }
  #tower.f-red .head::after { background: #E11; }
  #tower.f-checkered .head::after { background: repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0/8px 8px; }
  #tower .rows { position: relative; overflow: hidden; transition: height .4s ease; }
  /* caution: a yellow CAUTION band opens under the lap line, and the rows flash solid yellow for a moment */
  #tower .cbar { position: relative; height: 0; overflow: hidden; background: var(--yellow); color: #111; text-align: center; font-size: 16px; letter-spacing: 3px;
                 line-height: 26px; text-transform: uppercase; transition: height .35s cubic-bezier(.3,.8,.3,1); }
  #tower .cbar span { padding: 0 12px; }
  #tower.f-caution .cbar, #tower.f-pace .cbar, #tower.f-white .cbar, #tower.f-checkered .cbar { height: 26px; }
  #tower.f-white .cbar { background: #fff; }
  #tower.f-checkered .cbar { background: repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0/13px 13px; }
  #tower.f-checkered .cbar span { background: #111; color: #fff; display: inline-block; line-height: 26px; }
  #tower .cwipe { position: absolute; inset: 0; background: var(--yellow); z-index: 3; opacity: 0; pointer-events: none; }
  #tower .cwipe.white { background: #fff; }
  #tower .cwipe.checkered { background: repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0/34px 34px; }
  #tower .chdr { z-index: 4; }
  .row {
    position: absolute; left: 0; right: 0; height: var(--row); display: flex; align-items: center;
    transition: transform .55s cubic-bezier(.3,.8,.3,1), opacity .3s; font-size: 18px;
  }
  .row .bg { position: absolute; inset: 0; background: var(--grey80); }
  .row.alt .bg { background: var(--grey80b); }
  .row > *:not(.bg) { position: relative; }
  .row .pos { width: 42px; height: 100%; display: flex; align-items: center; justify-content: center; background: var(--poscol); font-size: 18px; }
  .row .cls { width: 4px; height: 100%; }
  .row .num { width: 46px; text-align: center; color: var(--midgrey); font-size: 17px; }
  .row .name { flex: 1; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .3px; }
  .row .gap { width: 92px; text-align: right; padding-right: 12px; font-family: var(--light); font-weight: 300; font-size: 17px; font-variant-numeric: tabular-nums; }
  /* pit road: the gap cell becomes a blue pit tag (box timer, then the stop time) */
  /* a tighter box than the gap column (78px + 14px gap = the same 92px), text centred */
  .row .gap.pitc { align-self: stretch; display: flex; align-items: center; justify-content: center; background: var(--blue); color: #fff;
                   width: 78px; margin-left: 14px; padding: 0 6px; white-space: nowrap;
                   font-family: var(--semi); font-weight: 600; font-size: 16px; letter-spacing: .5px; }
  .row .gap.pitc.pitdone { background: #111; box-shadow: inset 4px 0 0 var(--blue); }
  .row .pit { font-size: 12px; background: var(--blue); color: #fff; padding: 1px 6px; margin-right: 6px; letter-spacing: 1px; display: none; }
  .row .pit { display: none !important; }
  /* pit tags sit outside the ticker, to the right of the driver's row */
  #tower { position: absolute; }
  #tower .pits { position: absolute; left: 100%; top: 0; width: 0; pointer-events: none; }
  .ptag { position: absolute; left: 6px; height: 28px; margin-top: 3px; display: flex; align-items: center; gap: 6px; padding: 0 10px; white-space: nowrap;
          background: var(--blue); color: #fff; font-size: 15px; letter-spacing: 1px; font-variant-numeric: tabular-nums;
          transition: transform .55s cubic-bezier(.3,.8,.3,1); box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .ptag b { font-weight: 600; }
  .ptag span { font-family: var(--light); font-weight: 300; font-size: 16px; }
  .ptag.done { background: #111; border-left: 4px solid var(--blue); }
  /* meatball flag (repair): orange outline around the driver's row and a tag to the right, for 10 seconds */
  .row.mb::after { content: ""; position: absolute; inset: 0; border: 3px solid #FF7A00; z-index: 2; pointer-events: none; animation: mbPulse .8s ease-in-out infinite alternate; }
  @keyframes mbPulse { from { border-color: #FF7A00; } to { border-color: rgba(255,122,0,.35); } }
  .ptag.mbt { background: transparent; box-shadow: none; padding: 0 2px; }
  .ptag.mbt svg { height: 28px; width: auto; display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .row.focus .bg { background: rgba(255,13,64,.30); }
  .row.focus .pos { background: var(--red); }
  .row.focus .num { color: #fff; }
  .row.out { opacity: .55; }
  /* class header (ticker grouped by class) */
  .chdr { position: absolute; left: 0; right: 0; height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 10px;
          background: linear-gradient(90deg, var(--cc) 0 100%); font-size: 17px; letter-spacing: 1.5px; text-transform: uppercase;
          transition: transform .55s cubic-bezier(.3,.8,.3,1); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
  .chdr .cc { font-family: var(--light); font-weight: 300; font-size: 13px; letter-spacing: 1px; opacity: .85; }
  /* qualifying: cars on a flying lap get a green wash on the ticker */
  .row.hot .bg { background: linear-gradient(90deg, rgba(34,197,94,.30), rgba(34,197,94,.06) 70%), var(--grey80); }
  #tRows.paged::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; top: calc(var(--fixed) * 34px - 1px); background: var(--red); z-index: 2; }

  /* ---------- Lower third (focused driver) ---------- */
  #lower { left: 420px; bottom: 40px; min-width: 640px; max-width: 980px; }
  #lower .top { display: flex; align-items: stretch; height: 64px; }
  #lower .p { width: 78px; background: var(--red); display: flex; align-items: center; justify-content: center; font-size: 34px; }
  #lower .n { width: 78px; background: var(--black); display: flex; align-items: center; justify-content: center; font-size: 30px; color: #fff; }
  #lower .nm { flex: 1; background: var(--grey); display: flex; align-items: center; padding: 0 22px; font-size: 34px; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; position: relative; }
  /* line under the name: VSPEED red, or in multi-class races the class color, growing up into a small class label */
  #lower .nm .cline { position: absolute; left: 0; bottom: 0; height: 4px; width: 40%; background: var(--cc, var(--red)); transform-origin: left;
                      display: flex; align-items: center; padding-left: 22px; overflow: hidden; transition: height .45s cubic-bezier(.2,.8,.2,1); }
  #lower .nm .cline span { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; opacity: 0; transition: opacity .25s; }
  #lower.mc .nm .cline { height: 19px; }
  #lower.mc .nm .cline span { opacity: 1; transition-delay: .2s; }
  #lower.mc .nm .nt { transform: translateY(-7px); }
  #lower .nm .nt { transition: transform .45s cubic-bezier(.2,.8,.2,1); }
  #lower { overflow: hidden; }
  /* qualifying: live gap to pole for the car on camera (or its lap time just after the line) */
  #lower .qd { width: 200px; background: var(--black); display: flex; flex-direction: column; justify-content: center; align-items: flex-end; padding: 0 18px; border-left: 4px solid var(--green); }
  #lower .qd[hidden] { display: none; }
  #lower .qd .ql { font-family: var(--light); font-weight: 300; font-size: 14px; letter-spacing: 1.5px; color: #ccc; white-space: nowrap; }
  #lower .qd .qv { font-size: 32px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  #lower .qd.ahead .qv { color: var(--green); }
  #lower .qd.behind .qv { color: #ffd166; }
  #lower .qd.done { border-left-color: var(--midgrey); }
  #lower .qd.done.best { border-left-color: var(--red); background: linear-gradient(90deg, rgba(255,13,64,.35), var(--black)); }
  #lower .info { display: flex; background: var(--grey80b); font-family: var(--light); font-weight: 300; font-size: 19px; text-transform: uppercase; letter-spacing: .5px; }
  #lower .info span { padding: 8px 18px; border-right: 1px solid rgba(255,255,255,.15); white-space: nowrap; }
  #lower .info span:last-child { border-right: 0; }
  #lower .info b { font-family: var(--semi); font-weight: 600; color: var(--red); margin-right: 6px; }

  /* ---------- Standings / race info / team (the existing standings graphic, embedded) ---------- */
  .holder { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; transform-origin: 0 0; }
  .sframe { transform-origin: 0 0; position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; background: transparent; pointer-events: none; z-index: 20; }
  /* ---------- Board (grid / results) ---------- */
  #board { left: 50%; top: 120px; transform: translateX(-50%); width: 1100px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #board .h { background: var(--grey); font-size: 30px; padding: 12px 22px; position: relative; text-transform: uppercase; letter-spacing: .5px; }
  #board .h::after { content: ""; position: absolute; left: 0; bottom: 0; height: 5px; width: 45%; background: var(--red); transform-origin: left; }
  #board .h { overflow: hidden; }
  #board .h small { float: right; font-family: var(--light); font-weight: 300; font-size: 20px; margin-top: 8px; color: #fff; }
  #board .cols { display: flex; gap: 0; }
  #board .col { flex: 1; }
  #board .sh { display: flex; background: var(--black); font-family: var(--light); font-weight: 300; font-size: 15px; padding: 6px 0; letter-spacing: 1px; }
  #board .r { display: flex; align-items: center; height: 36px; font-size: 19px; background: var(--grey80); }
  #board .r:nth-child(even) { background: var(--grey80b); }
  #board .r .bp, #board .sh .bp { width: 60px; text-align: center; }
  #board .r .bp { background: var(--poscol); height: 100%; display: flex; align-items: center; justify-content: center; }
  #board .r .bn, #board .sh .bn { width: 60px; text-align: center; color: var(--midgrey); }
  #board .sh .bn { color: #fff; }
  #board .r .bd, #board .sh .bd { flex: 1; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
  #board .r .bg2, #board .sh .bg2 { width: 120px; text-align: right; padding-right: 16px; font-family: var(--light); font-weight: 300; }
  #board .col + .col { border-left: 2px solid rgba(0,0,0,.5); }

  /* ---------- Penalty box (top center): pops up on its own when a driver gets a black flag ---------- */
  #penalty { top: 34px; left: 50%; transform: translateX(-50%); display: flex; height: 74px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.45)); }
  #penalty .ic { width: 104px; background: var(--black); display: flex; align-items: center; justify-content: center; border-right: 4px solid var(--red); }
  #penalty .ic span { font-family: "Industry Black", "Industry-Black", "Industry Bold", "Industry-Bold", "Industry", Impact, "Arial Black", sans-serif;
                      font-weight: 400; font-size: 46px; line-height: 1; transform: skewX(-10deg); color: #fff; }
  #penalty .tx { background: var(--grey); padding: 0 26px; display: flex; flex-direction: column; justify-content: center; min-width: 400px; position: relative; overflow: hidden; }
  #penalty .t1 { font-size: 15px; letter-spacing: 3px; color: #bbb; }
  #penalty .t2 { font-size: 28px; text-transform: uppercase; display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
  #penalty .t2 .lt { font-family: var(--light); font-weight: 300; font-size: 20px; color: #ccc; }
  #penalty .rs { background: #111; padding: 0 22px; display: flex; flex-direction: column; justify-content: center; gap: 6px; align-items: flex-start; min-width: 220px; }
  #penalty .rs .why { font-family: var(--light); font-weight: 300; font-size: 18px; text-transform: uppercase; white-space: nowrap; }
  #penalty .rs .why:empty { display: none; }
  #penalty .st { display: inline-block; font-size: 15px; letter-spacing: 2px; padding: 4px 10px; border-radius: 2px; background: #fff; color: #111; }

  /* ---------- Next broadcast (Prerace tab): bottom centre, title bar + logo + event / date / time ---------- */
  #nextrace { left: 960px; bottom: 82px; transform: translateX(-50%); min-width: 786px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #nextrace .h { position: relative; overflow: hidden; background: #232324; height: 62px; padding: 0 19px; display: flex; align-items: center;
                 font-size: 46px; letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; }
  #nextrace .h::after { content: ""; position: absolute; left: 0; bottom: 0; height: 5px; width: 70%; background: var(--red); transform-origin: left; }
  #nextrace .b { display: flex; align-items: center; background: #2b2b2c; height: 146px; padding: 0 36px 0 0; }
  #nextrace .lg { width: 300px; height: 100%; display: flex; align-items: center; justify-content: center; padding: 4px 10px; flex: 0 0 auto; }
  #nextrace .lg img { max-width: 100%; max-height: 140px; object-fit: contain; filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
  #nextrace.nologo .lg { width: 36px; }
  #nextrace.nologo .lg img { display: none; }
  #nextrace .tx { flex: 1; text-align: center; white-space: nowrap; text-shadow: 0 3px 8px rgba(0,0,0,.7); }
  #nextrace .ev { font-size: 46px; letter-spacing: .5px; text-transform: uppercase; line-height: 1.1; }
  #nextrace .dt { font-family: var(--light); font-weight: 300; font-size: 38px; letter-spacing: 1px; text-transform: uppercase; margin-top: 8px;
                  display: flex; align-items: center; justify-content: center; gap: 22px; }
  #nextrace .dt i { width: 5px; height: 40px; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.6); }
  #nextrace.nodiv .dt i { display: none; }
  #nextrace .bar { height: 10px; background: var(--red); transform-origin: left; }

  /* ---------- Biggest movers (bottom right, about the size of the race info box) ---------- */
  #movers { right: 40px; bottom: 40px; width: 520px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  /* ---------- Race off pit road: sits on the ticker, same width, anchored to its bottom and rising up over the lower rows ---------- */
  #tower #pitrace { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; box-shadow: 0 -8px 24px rgba(0,0,0,.45); }
  #tower #pitrace:not(.off) { visibility: visible; }   /* shows even when the ticker itself is switched off */
  #pitrace .h { background: var(--grey); font-size: 19px; padding: 8px 14px 9px; position: relative; overflow: hidden; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
  #pitrace .h::after { content: ""; position: absolute; left: 0; bottom: 0; height: 4px; width: 55%; background: var(--red); transform-origin: left; }
  #pitrace .h small { float: right; font-family: var(--light); font-weight: 300; font-size: 14px; margin-top: 4px; letter-spacing: 1px; }
  #pitrace .sh { display: flex; background: var(--black); font-family: var(--light); font-weight: 300; font-size: 11px; padding: 4px 0; letter-spacing: 1px; }
  #pitrace .r { display: flex; align-items: center; height: var(--row); font-size: 17px; background: #1e1e1f; }   /* solid: the ticker rows are underneath */
  #pitrace .r:nth-child(odd) { background: #151515; }
  #pitrace .c1 { width: 38px; text-align: center; }
  #pitrace .r .c1 { background: #080808; height: 100%; display: flex; align-items: center; justify-content: center; }
  #pitrace .cc { width: 4px; align-self: stretch; }
  #pitrace .c2 { width: 40px; text-align: center; color: var(--midgrey); }
  #pitrace .sh .c2 { color: #fff; }
  #pitrace .c3 { flex: 1; min-width: 0; padding-left: 2px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pitrace .c5 { width: 52px; text-align: center; }
  #pitrace .r .c5 { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #888; }
  #pitrace .r .c5.up { background: #1b3a26; color: var(--green); }
  #pitrace .r .c5.dn { background: #3d1820; color: #ff5a6e; }
  #pitrace .r .c5.pen { background: #fff; color: #111; font-size: 9px; letter-spacing: .5px; }
  #pitrace .c6 { width: 62px; text-align: right; padding-right: 10px; font-variant-numeric: tabular-nums; }
  #pitrace .r .c6 { font-family: var(--light); font-weight: 300; font-size: 16px; }
  #pitrace .r .c6.best { color: #c86bff; font-family: var(--semi); font-weight: 600; }   /* fastest stop, like a fastest lap */
  #pitrace .ft { background: var(--black); font-family: var(--light); font-weight: 300; font-size: 13px; padding: 6px 12px; letter-spacing: .3px; color: #ddd; line-height: 1.35; }
  #pitrace .ft b { display: block; font-family: var(--semi); font-weight: 600; color: #fff; letter-spacing: 1px; font-size: 12px; }
  #movers .h { background: var(--grey); font-size: 24px; padding: 10px 18px 12px; position: relative; overflow: hidden; text-transform: uppercase; letter-spacing: .5px; }
  #movers .h::after { content: ""; position: absolute; left: 0; bottom: 0; height: 4px; width: 45%; background: var(--red); transform-origin: left; }
  #movers .h small { float: right; font-family: var(--light); font-weight: 300; font-size: 15px; margin-top: 7px; letter-spacing: 1px; }
  #movers .sh { display: flex; background: var(--black); font-family: var(--light); font-weight: 300; font-size: 12px; padding: 5px 0; letter-spacing: 1px; }
  #movers .r { display: flex; align-items: center; height: 42px; font-size: 19px; background: var(--grey80); }
  #movers .r:nth-child(odd) { background: var(--grey80b); }
  #movers .c1 { width: 46px; text-align: center; }
  #movers .r .c1 { background: var(--poscol); height: 100%; display: flex; align-items: center; justify-content: center; }
  #movers .cc { width: 4px; align-self: stretch; }
  #movers .c2 { width: 48px; text-align: center; color: var(--midgrey); }
  #movers .sh .c2 { color: #fff; }
  #movers .c3 { flex: 1; padding-left: 4px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #movers .c4, #movers .c5 { width: 62px; text-align: center; }

  #movers .c6 { width: 92px; text-align: center; }
  #movers .r .c6 { background: rgba(34,197,94,.18); height: 100%; display: flex; align-items: center; justify-content: center; color: var(--green); font-size: 21px; }
  #movers .none { background: var(--grey80); font-family: var(--light); font-weight: 300; font-size: 17px; padding: 14px 18px; color: #ddd; }

  /* ---------- Drive graphic (ready-made PNG / WebM from the Google Drive folder) ---------- */
  #gfx { left: 960px; top: 540px; transform: translate(-50%, -50%); }
  #gfx img, #gfx video { display: block; max-width: none; }
  #gfx .media.none { display: none; }
  #gfxShineBox { position: absolute; overflow: hidden; pointer-events: none; }

  /* ---------- Grid (starting grid, one row at a time) ---------- */
  #grid { left: 960px; bottom: 70px; transform: translateX(-50%); width: 1700px; }
  #grid .gtop { display: flex; justify-content: center; height: 50px; }
  #grid .gp { width: 160px; background: var(--red); display: flex; align-items: center; justify-content: center; font-size: 30px; letter-spacing: .5px; overflow: hidden; }
  #grid .gr { width: 232px; background: #000; display: flex; align-items: center; justify-content: center; font-size: 25px; letter-spacing: 1px; overflow: hidden; }
  #grid .gbar { position: relative; display: flex; height: 154px; background: rgba(38,38,38,.95); overflow: hidden; }
  #grid .gmid { flex: 0 0 232px; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  #grid .gmid img { width: 190px; }
  #grid .gmid div { font-size: 21px; letter-spacing: .3px; }
  #grid .gside { flex: 1; position: relative; overflow: hidden; }
  #grid .gin { position: absolute; inset: 0; display: flex; align-items: center; }
  #grid .gside.l .gin { justify-content: flex-end; }
  #grid .gside.r .gin { justify-content: flex-start; }
  #grid .gcar { position: absolute; top: 4px; bottom: 8px; width: 270px; display: flex; flex-direction: column; justify-content: flex-end; }
  #grid .gcar { align-items: center; }   /* car name centered under the render */
  #grid .gside.l .gin { padding-left: 300px; }
  #grid .gside.r .gin { padding-right: 300px; }
  #grid .gside.l .gcar { left: 18px; }
  #grid .gside.r .gcar { right: 18px; }
  #grid .gcar img { max-width: 265px; max-height: 120px; object-fit: contain; margin: 0 auto auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
  #grid .gcar img.none { display: none; }
  #grid .gcn { font-family: var(--light); font-weight: 300; font-size: 14px; text-transform: uppercase; letter-spacing: .3px; white-space: nowrap; color: #fff; max-width: 270px; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  #grid .gtxt { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  #grid .gside.l .gtxt { align-items: flex-end; text-align: right; }
  #grid .gside.r .gtxt { align-items: flex-start; text-align: left; }
  #grid .gname { font-family: var(--light); font-weight: 400; font-size: 46px; text-transform: uppercase; white-space: nowrap; line-height: 1.05; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  #grid .gtime { font-size: 30px; color: var(--red); font-variant-numeric: tabular-nums; }
  /* car number: Industry if it's installed on the broadcast PC, otherwise Impact (built into Windows). Plain white. */
  #grid .gnum { width: 160px; text-align: center; font-family: "Industry Black", "Industry-Black", "Industry Bold", "Industry-Bold", "Industry", Impact, "Arial Black", sans-serif;
                font-weight: 400; font-style: normal; font-size: 90px; line-height: 1; letter-spacing: 0; color: #fff;
                transform: skewX(-10deg); }
  #grid .gside.l .gnum { margin: 0 14px 0 20px; }
  #grid .gside.r .gnum { margin: 0 20px 0 14px; }
  #grid .gside.empty .gin { visibility: hidden; }
  #grid .gline { height: 7px; background: var(--red); }
  #grid.hit, #grid.hit * { pointer-events: auto !important; }   /* only during the grid self-check */
  /* Pole Award on Row 1: POLE tab, red wash + white frame on the pole sitter's side, the badge in the car spot */
  #grid .gtop { position: relative; }
  #grid .gpole { position: absolute; top: 0; height: 100%; width: 160px; background: var(--red); display: none; align-items: center; justify-content: center; font-size: 30px; letter-spacing: .5px; }
  #grid .gwash, #grid .gframe, #grid .gaw { position: absolute; display: none; pointer-events: none; }
  #grid.aw .gpole { display: flex; }
  #grid.aw .gwash, #grid.aw .gframe { display: block; }
  #grid.aw .gaw { display: flex; }
  /* the pole sitter's car render steps aside for the badge. Done with a class + transition, not a script animation:
     in the broadcasting software's browser (Chrome 115) the scripted fade left the render at opacity 0 after the
     award came off (Oct 25 log). Leaving: fades back after .15s; entering: fades out after .4s, under the badge. */
  #grid .gside.l .gcar { transition: opacity .3s ease .15s, transform .3s ease .15s; }
  #grid.awcar .gside.l .gcar { opacity: 0; transform: translateX(-30px); transition: opacity .35s ease .4s, transform .35s ease .4s; }
  #grid .gwash { inset: 0; background: linear-gradient(90deg, rgba(255,13,64,.34), rgba(255,13,64,.06) 75%); }
  #grid .gframe { inset: 0; width: 100%; height: 100%; overflow: visible; }
  #grid .gframe rect { fill: none; stroke: var(--blue); stroke-width: 4px; vector-effect: non-scaling-stroke; x: 2px; y: 2px; width: calc(100% - 4px); height: calc(100% - 4px); }   /* VSPEED blue frame, kept fully inside the box */
  #grid .gaw { left: 18px; top: 6px; bottom: 8px; width: 270px; flex-direction: column; align-items: center; justify-content: flex-end; overflow: hidden; }
  #grid .gaw img { height: 112px; margin: 0 auto auto; filter: drop-shadow(0 4px 8px rgba(0,0,0,.6)); }
  #grid .gawc { font-size: 15px; letter-spacing: 3px; white-space: nowrap; }

  /* ---------- Flag banner ---------- */
  #flag { top: 34px; left: 50%; transform: translateX(-50%); display: flex; height: 64px; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
  #flag .sw { width: 64px; }
  /* sponsor graphic (Race tab): full screen, the loaded image as is (made at 1920x1080 it fills the frame; smaller art is centered) */
  #sponsor { left: 0; top: 0; width: 1920px; height: 1080px; }
  /* ---------- Podium (after the race): full-screen VSPEED artwork for the winner / 2nd / 3rd, with the driver's data ---------- */
  #podium { left: 0; top: 0; width: 1920px; height: 1080px; }
  #podium img { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #podium .ptx { position: absolute; left: 206px; top: 836px; right: 120px; }   /* in the dark band along the bottom of the artwork */
  #podium .pn { font-family: var(--semi); font-weight: 600; font-size: 100px; line-height: 1; color: var(--red); text-transform: uppercase; white-space: nowrap; letter-spacing: .5px; }
  #podium .ps { margin-top: 16px; display: flex; gap: 78px; font-family: var(--semi); font-weight: 600; font-size: 36px; color: #fff; text-transform: uppercase; white-space: nowrap; letter-spacing: .3px; }
  #sponsor .pic { width: 100%; height: 100%; }
  #sponsor img { display: block; width: 100%; height: 100%; object-fit: contain; }
  #flag .tx { position: relative; overflow: hidden; background: var(--grey); padding: 0 34px; display: flex; align-items: center; font-size: 30px; letter-spacing: 2px; text-transform: uppercase; }
  #flag.green .sw { background: var(--green); }
  #flag.caution .sw { background: var(--yellow); }
  #flag.white .sw { background: #fff; }
  #flag.red .sw { background: #E11; }
  #flag.checkered .sw { background: repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0/16px 16px; }

</style>

<script>
const $ = id => document.getElementById(id);
if (new URLSearchParams(location.search).has('preview')) document.body.classList.add('preview');

let S = null, L = null, SD = null, RAW = null, PEN = null, PR = null;
let lowerMcAt = 0, lastCam = null, camShownAt = 0, towerPage = 0, pageAt = 0;
let lastFlag = null, flagTimer = null, lastTrigger = 0, trigInit = false;
const rowEls = new Map();

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cleanName(n) { return String(n || '').replace(/\d+$/, '').trim(); }
function lastName(n) {
  const parts = cleanName(n).split(/\s+/);
  let last = parts.pop() || '';
  if (/^(jr\.?|sr\.?|ii|iii|iv)$/i.test(last) && parts.length) last = parts.pop();
  return last.toUpperCase();
}
function tickerName(n) {   // first initial + last name: Ryan Carter -> R. CARTER
  const first = cleanName(n).split(/\s+/)[0] || '', last = lastName(n);
  return first && first.toUpperCase() !== last ? first[0].toUpperCase() + '. ' + last : last;
}
/* ---------- in / out animations ----------
   show(id, on) plays the widget's intro or exit once per change (like the standings,
   race info and team boxes): headers wipe in with a red accent and a light sweep,
   bodies unfold underneath. The ticker grows down when it shows and folds up when it hides. */
const EASE = 'cubic-bezier(.2,.8,.2,1)', EASE_IN = 'cubic-bezier(.6,0,.8,.3)';
const VIS = {};
function anim(el, frames, o) { if (!el || !el.animate) return null; return el.animate(frames, Object.assign({ easing: EASE, fill: 'backwards' }, o)); }
function shineOn(box, delay) {
  if (!box) return;
  // the sweep must stay inside its box: an unpositioned box lets it attach to the widget and run past the edge
  // (the caution band did this: a sweep across empty screen right of the ticker, Oct 2026)
  const cs = getComputedStyle(box);
  if (cs.position === 'static') box.style.position = 'relative';
  if (cs.overflow !== 'hidden') box.style.overflow = 'hidden';
  let sh = box.querySelector(':scope > .shine');
  if (!sh) { sh = document.createElement('div'); sh.className = 'shine'; box.appendChild(sh); }
  anim(sh, [{ transform: 'translateX(-200px)', opacity: 1 }, { transform: `translateX(${box.offsetWidth + 200}px)`, opacity: 1 }], { duration: 850, delay, easing: 'ease-in-out', fill: 'none' });
}
const wipeIn  = [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }];
const wipeOut = [{ clipPath: 'inset(0 0 0 0)' }, { clipPath: 'inset(0 0 0 100%)' }];
const dropIn  = [{ clipPath: 'inset(0 0 100% 0)' }, { clipPath: 'inset(0 0 0 0)' }];   // grows down
const foldUp  = [{ clipPath: 'inset(0 0 0 0)' }, { clipPath: 'inset(0 0 100% 0)' }];   // folds up
const lineIn  = [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }];
const lineOut = [{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }];
const q = (id, sel) => $(id).querySelector(sel);

// each returns how long its animation lasts (ms)
const IN = {
  sponsor(el) {
    anim(q('sponsor', '.pic'), [{ opacity: 0 }, { opacity: 1 }], { duration: 350, easing: 'ease-out' });
    return 350;
  },
  logo(el) {
    anim(q('logo', '.plate'), wipeIn, { duration: 650 });
    const k = logoSkew();
    anim(q('logo', '.plate img'), [{ opacity: 0, transform: `skewX(${k}deg) translateX(-40px)` }, { opacity: 1, transform: `skewX(${k}deg)` }], { duration: 600, delay: 250 });
    anim(q('logo', '.accent'), [{ transform: `skewX(${-k}deg) scaleX(0)`, transformOrigin: 'left' }, { transform: `skewX(${-k}deg) scaleX(1)`, transformOrigin: 'left' }], { duration: 750, delay: 400 });
    shineOn(q('logo', '.plate'), 750);
    return 1600;
  },
  league(el) {
    anim(q('league', 'img'), [{ opacity: 0, transform: 'scale(.85)' }, { opacity: 1, transform: 'none' }], { duration: 600 });
    anim(q('league', '.tag'), wipeIn, { duration: 550, delay: 300 });
    return 900;
  },
  tower(el) {
    const head = q('tower', '.head');
    anim(head, wipeIn, { duration: 550 });
    anim(head, lineIn, { duration: 700, delay: 350, pseudoElement: '::after' });
    anim(q('tower', '.sub'), dropIn, { duration: 350, delay: 300 });
    const rows = $('tRows'), n = rows.children.length;
    const dur = 350 + n * 30;
    anim(rows, dropIn, { duration: dur, delay: 500, easing: 'cubic-bezier(.3,.6,.3,1)' });
    anim($('tPits'), [{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: 500 + dur - 200 });
    shineOn(head, 650);
    return 500 + dur;
  },
  lower(el) {
    anim(q('lower', '.p'), [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }], { duration: 450, easing: 'cubic-bezier(.2,1.4,.4,1)' });
    anim(q('lower', '.n'), wipeIn, { duration: 400, delay: 150 });
    const nm = q('lower', '.nm');
    anim(nm, wipeIn, { duration: 600, delay: 250 });
    $('lower').classList.remove('mc'); lowerMcAt = Date.now() + 1300;
    anim(q('lower', '.cline'), lineIn, { duration: 700, delay: 550 });
    anim(q('lower', '.info'), dropIn, { duration: 450, delay: 600 });
    shineOn(nm, 800);
    return 1650;
  },
  penalty(el) {
    anim(q('penalty', '.ic'), [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 350 });
    anim(q('penalty', '.ic span'), [{ opacity: 0, transform: 'skewX(-10deg) translateY(12px)' }, { opacity: 1, transform: 'skewX(-10deg)' }], { duration: 400, delay: 200 });
    anim(q('penalty', '.tx'), wipeIn, { duration: 550, delay: 150 });
    anim(q('penalty', '.rs'), wipeIn, { duration: 500, delay: 350 });
    shineOn(q('penalty', '.tx'), 600);
    return 1000;
  },
  pitrace(el) {   // rises up from the bottom of the ticker
    anim(el, [{ clipPath: 'inset(100% 0 0 0)', transform: 'translateY(40px)' }, { clipPath: 'inset(0 0 0 0)', transform: 'none' }], { duration: 650, easing: 'cubic-bezier(.2,.8,.3,1)' });
    anim(q('pitrace', '.h'), lineIn, { duration: 700, delay: 450, pseudoElement: '::after' });
    shineOn(q('pitrace', '.h'), 600);
    return 1100;
  },
  podium(el) {   // the artwork slides in from the left, then the name and the stats
    anim($('podImg'), [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: 700, easing: 'cubic-bezier(.2,.8,.3,1)' });
    anim(q('podium', '.pn'), wipeIn, { duration: 600, delay: 450 });
    anim(q('podium', '.ps'), [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { duration: 450, delay: 750 });
    return 1200;
  },
  nextrace(el) {   // title bar wipes in, the box opens underneath, then the logo and the text
    const h = q('nextrace', '.h');
    anim(h, wipeIn, { duration: 600 });
    anim(h, lineIn, { duration: 750, delay: 400, pseudoElement: '::after' });
    anim(q('nextrace', '.b'), dropIn, { duration: 650, delay: 350, easing: 'cubic-bezier(.3,.6,.3,1)' });
    anim(q('nextrace', '.bar'), lineIn, { duration: 600, delay: 600 });
    anim(q('nextrace', '.lg'), [{ opacity: 0, transform: 'scale(.85)' }, { opacity: 1, transform: 'none' }], { duration: 500, delay: 750 });
    anim(q('nextrace', '.ev'), [{ opacity: 0, transform: 'translateX(-40px)' }, { opacity: 1, transform: 'none' }], { duration: 550, delay: 850 });
    anim(q('nextrace', '.dt'), [{ opacity: 0, transform: 'translateX(-40px)' }, { opacity: 1, transform: 'none' }], { duration: 550, delay: 1000 });
    shineOn(h, 700);
    return 1600;
  },
  movers(el) {
    const h = q('movers', '.h');
    anim(h, wipeIn, { duration: 600 });
    anim(h, lineIn, { duration: 750, delay: 400, pseudoElement: '::after' });
    anim($('mvBody'), dropIn, { duration: 650, delay: 400, easing: 'cubic-bezier(.3,.6,.3,1)' });
    shineOn(h, 700);
    return 1300;
  },
  board(el) {
    const h = q('board', '.h');
    // the results board once came up with only its title bar (Oct 25, couldn't reproduce): if that happens again,
    // say so in the log (Save diagnostics) with what it had to show
    setTimeout(() => {
      const rows = document.querySelectorAll('#bCols .r').length, cs = getComputedStyle($('bCols'));
      if (VIS.board && VIS.board.on && (!rows || cs.visibility === 'hidden' || +cs.opacity < 0.1))
        try { navigator.sendBeacon('/api/clientlog', JSON.stringify({ page: 'overlay', msg: `Results board up with ${rows} rows (cars ${L && L.cars ? L.cars.length : '?'}, opacity ${cs.opacity}, clip ${cs.clipPath}, anims ${$('bCols').getAnimations().length})` })); } catch (e) {}
    }, 2500);
    anim(h, wipeIn, { duration: 600 });
    anim(h, lineIn, { duration: 750, delay: 400, pseudoElement: '::after' });
    anim($('bCols'), dropIn, { duration: 750, delay: 450, easing: 'cubic-bezier(.3,.6,.3,1)' });
    shineOn(h, 700);
    return 1550;
  },
  flag(el) {
    anim(q('flag', '.sw'), [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 400 });
    anim(q('flag', '.tx'), wipeIn, { duration: 600, delay: 200 });
    shineOn(q('flag', '.tx'), 550);
    return 1400;
  },
};
const OUT = {
  penalty(el) {
    anim(q('penalty', '.rs'), wipeOut, { duration: 350, easing: EASE_IN, fill: 'forwards' });
    anim(q('penalty', '.tx'), wipeOut, { duration: 400, delay: 120, easing: EASE_IN, fill: 'forwards' });
    anim(q('penalty', '.ic'), [{ transform: 'scaleY(1)' }, { transform: 'scaleY(0)' }], { duration: 250, delay: 400, easing: 'ease-in', fill: 'forwards' });
    return 700;
  },
  sponsor(el) {
    anim(q('sponsor', '.pic'), [{ opacity: 1 }, { opacity: 0 }], { duration: 350, easing: 'ease-in', fill: 'forwards' });
    return 350;
  },
  logo() {
    const k = logoSkew();
    anim(q('logo', '.accent'), [{ transform: `skewX(${-k}deg) scaleX(1)`, transformOrigin: 'left' }, { transform: `skewX(${-k}deg) scaleX(0)`, transformOrigin: 'left' }], { duration: 350, easing: 'ease-in', fill: 'forwards' });
    anim(q('logo', '.plate'), wipeOut, { duration: 500, delay: 200, easing: EASE_IN, fill: 'forwards' });
    return 700;
  },
  league() {
    anim(q('league', '.tag'), wipeOut, { duration: 350, easing: EASE_IN, fill: 'forwards' });
    anim(q('league', 'img'), [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.85)' }], { duration: 400, delay: 200, easing: 'ease-in', fill: 'forwards' });
    return 600;
  },
  tower() {
    const rows = $('tRows'), n = rows.children.length, dur = 300 + n * 20;
    anim(rows, foldUp, { duration: dur, easing: 'cubic-bezier(.5,0,.7,.4)', fill: 'forwards' });
    anim($('tPits'), [{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' });

function filteredCars() {

/* ---------- tower ---------- */
// OVERTIME · ATTEMPT 1 OF 1: the attempt running (green) or coming up (caution), and iRacing's limit for the race.
// Plain OVERTIME when the attempts are used up or unknown (the overlay started mid-overtime).
function overtimeLabel(yellow) {
  const done = L.otAttempts, lim = L.otLimit;

  const n = yellow ? done + 1 : Math.max(1, done);

function renderTower() {
  const on = S.show.tower && L.connected && L.cars.length;
  show('tower', on);
  if (!on) return;
  $('tHead').textContent = S.raceName || L.track || 'VSPEED';
  let sub;
  if (L.isRace && L.sessionState >= 5) sub = 'FINISHED';   // checkered flag is out (and cool-down after it)
  else if (L.isRace && L.totalLaps) {
    const lap = Math.max(1, L.lap), togo = L.totalLaps - lap + 1;   // TV style, counts the lap in progress: lap 51 of 60 -> 10 TO GO
    const yellow = L.flag === 'caution' || L.flag === 'red';
    const fl = L.finalLap ?? L.totalLaps, finalLap = fl > 0 && lap >= fl && !yellow;   // the white flag lap (a caution there isn't one)
    sub = L.sessionState < 4 ? 'START · ' + L.totalLaps + ' LAPS'
        : (L.sessionState === 4 && finalLap) ? 'FINAL LAP'
        : (L.sessionState === 4 && L.overtime) ? overtimeLabel(yellow)   // green-white-checkered past the scheduled distance
        : (L.sessionState === 4 && togo >= 2 && togo <= 10) ? `${togo} TO GO`
        : `LAP ${lap} / ${L.totalLaps}`;
  }
  else if (L.isRace) sub = `LAP ${Math.max(1, L.lap)}` + (L.timeRemain ? ' · ' + L.timeRemain : '');
  else sub = (L.sessionName || '') + (L.timeRemain ? ' · ' + L.timeRemain : '');
  $('tSub').textContent = sub;
  const flagColors = { green: 'var(--green)', caution: 'var(--yellow)', pace: 'var(--yellow)', white: '#fff', red: '#E11', checkered: 'repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0/7px 7px' };
  $('tFlag').style.background = flagColors[L.flag] || 'transparent';
  ['caution', 'pace', 'white', 'red', 'checkered'].forEach(f => $('tower').classList.toggle('f-' + f, L.flag === f));
  // pace laps before the start get a yellow PACE LAP band (no flag wipe); iRacing's one-lap-to-green signal changes CAUTION to ONE TO GREEN
  const band = L.flag === 'pace' ? 'Pace lap' : L.flag === 'caution' && L.oneToGreen ? 'One to green' : FLAG_BAND[L.flag];
  if (band && $('tCbar').firstChild.textContent !== band) {
    const swap = !!$('tCbar').firstChild.textContent && $('tower').classList.contains('f-caution');
    $('tCbar').firstChild.textContent = band;
    if (swap) { anim($('tCbar').firstChild, wipeIn, { duration: 450 }); shineOn($('tCbar'), 150); }
  }

  const multi = (L.classes || []).length > 1 && !S.classFilter;
  const split = multi && S.classSplit !== false;
  const max = Math.max(5, Math.min(40, +S.towerRows || 20));
  const fixedAll = Math.max(0, Math.min(max - 1, +(S.towerFixed ?? 15)));
  const now = Date.now(), every = Math.max(3, +S.towerPageSec || 8) * 1000;
  // Show `rows` of a list; if it's longer, keep the top `fixed` and page the remaining slots through the rest.
  const pageList = (list, rows, fixed) => {
    if (list.length <= rows) return { shown: list, paged: false };
    const slots = Math.max(1, rows - fixed), rest = list.slice(fixed), pages = Math.ceil(rest.length / slots);
    const pg = towerPage % pages;

  };

  const items = [];          // what goes on the board, top to bottom: class headers and cars, each with its y
  let y = 0, anyPaged = false;

    classes.sort((a, b) => pace(a) - pace(b));

      const fixed = Math.min(rows - 1, Math.round(rows * fixedAll / max));
      const r = pageList(list, rows, Math.max(0, fixed));

      items.push({ hdr: cls, color: (list[0] && list[0].clsColor) || '#888', count: list.length, y }); y += HDR_H;
      r.shown.forEach((c, i) => { items.push({ c, y, i }); y += 34; });

  } else {
    const r = pageList(all, max, fixedAll);

  }
  if (all.length > max || anyPaged) { if (!pageAt) pageAt = now; if (now - pageAt >= every) { towerPage++; pageAt = now; } }
  else { towerPage = 0; pageAt = 0; }
  $('tRows').classList.toggle('paged', anyPaged && !split);
  $('tRows').style.setProperty('--fixed', fixedAll);
  const wasShown = VIS.tower && VIS.tower.on && $('tRows').children.length > 0;
  let newCount = 0;
  const seen = new Set();
  const rowsEl = $('tRows');
  items.forEach(it => {
    if (it.hdr) {               // class header bar in the class color
      const key = 'h:' + it.hdr;
      let el = rowEls.get(key);

        el = document.createElement('div'); el.className = 'chdr';
        el.innerHTML = '<span class="cn"></span><span class="cc"></span>';
        el.style.transform = `translateY(${it.y}px)`;
        rowsEl.appendChild(el); rowEls.set(key, el);

      seen.add(key);

      el.style.setProperty('--cc', it.color);

    }
    const c = it.c;
    let el = rowEls.get(c.idx);
    if (!el) {
      el = document.createElement('div');
      el.className = 'row';
      el.innerHTML = '<div class="bg"></div><div class="pos"></div><div class="cls"></div><div class="num"></div><div class="name"></div><span class="pit">PIT</span><div class="gap"></div>';
      el.style.transform = `translateY(${it.y}px)`;
      rowsEl.appendChild(el);
      rowEls.set(c.idx, el);
      // a new driver on the board (page flip or a car moving into view): wipe their row in
      if (wasShown) anim(el, wipeIn, { duration: 450, delay: 60 * newCount++ });

    seen.add(c.idx);
    el.style.transform = `translateY(${it.y}px)`;
    el.classList.toggle('alt', it.i % 2 === 1);
    el.classList.toggle('focus', c.idx === L.camCarIdx);
    el.classList.toggle('inpit', !!c.pit);
    el.classList.toggle('out', !c.onTrack);
    el.classList.toggle('mb', meatOn(c));
    el.children[1].textContent = S.classFilter || multi ? c.classPos : c.pos;
    el.children[2].style.background = multi ? (c.clsColor || 'transparent') : 'transparent';
    el.children[3].textContent = c.num;
    el.children[4].textContent = tickerName(c.name);
    const inClass = !!S.classFilter || split;
    const g = S.towerMode === 'leader' ? (inClass ? c.classGap : c.gap) : (inClass ? c.classInterval : c.interval);
    // pit road: the gap cell turns blue and shows PIT, the running box time, then the final stop time
    const pitTxt = c.pitState === 'stall' ? 'PIT ' + (c.pitTime != null ? c.pitTime.toFixed(1) : '')
                 : c.pitState === 'done' ? (c.pitTime != null ? c.pitTime.toFixed(1) + 's' : 'PIT')

    el.children[6].classList.toggle('pitc', !!pitTxt);
    el.children[6].classList.toggle('pitdone', c.pitState === 'done');
    el.children[6].textContent = pitTxt || (g === 'LEADER' ? (L.isRace ? 'LEADER' : '') : (g === 'NO TIME' && isQual() ? '—' : g)) || '';

  for (const [key, el] of rowEls) if (!seen.has(key)) { el.remove(); rowEls.delete(key); }

const HDR_H = 30;
function isQual() { return !!L && !L.isRace && /qual/i.test(L.sessionType || L.sessionName || ''); }

/* ---------- pit tags: PIT on pit road, a running timer while stopped in the box, then the final stop time ---------- */
const pitEls = new Map();
const MB = new Map();   // car idx -> when its meatball flag was first seen
const MB_SHOW = 10000;
// meatball flag graphic: black flag with an orange disc, on a short pole
const MEATBALL_SVG = '<svg viewBox="0 0 46 30" xmlns="http://www.w3.org/2000/svg" aria-label="Meatball flag">' +
  '<rect x="1" y="0" width="3" height="30" rx="1" fill="#d9d9d9"/>' +
  '<path d="M4 1 H44 Q42 13 44 25 H4 Z" fill="#111" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>' +
  '<circle cx="24" cy="13" r="7.5" fill="#FF7A00"/></svg>';
function meatOn(c) {
  if (!c.meatball) { MB.delete(c.idx); return false; }
  if (!MB.has(c.idx)) MB.set(c.idx, Date.now());
  return Date.now() - MB.get(c.idx) < MB_SHOW;
}
function renderPits(rows) {
  const layer = $('tPits');
  layer.style.top = $('tRows').offsetTop + 'px';
  const seen = new Set();
  rows.forEach(({ c, y }) => {
    const mb = meatOn(c);
    if (!mb) return;   // only the meatball pops out to the right now; pit info lives in the gap cell
    seen.add(c.idx);
    let el = pitEls.get(c.idx);
    if (!el) {
      el = document.createElement('div'); el.className = 'ptag';
      el.style.transform = `translateY(${y}px)`;
      layer.appendChild(el); pitEls.set(c.idx, el);
      anim(el, [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: 350 });
    }
    el.style.transform = `translateY(${y}px)`;
    el.classList.toggle('done', !mb && c.pitState === 'done');
    el.classList.toggle('mbt', mb);
    const t = c.pitTime != null ? c.pitTime.toFixed(1) : '';
    const html = mb ? MEATBALL_SVG : c.pitState === 'stall' ? `<b>PIT</b><span>${t}</span>` : c.pitState === 'done' ? `<b>PIT</b><span>${t}s</span>` : '<b>PIT</b>';
    if (el.innerHTML !== html) el.innerHTML = html;
  });
  for (const [idx, el] of pitEls) if (!seen.has(idx) && !el._leaving) {
    el._leaving = true; pitEls.delete(idx);
    const a = anim(el, [{ clipPath: 'inset(0 0 0 0)' }, { clipPath: 'inset(0 100% 0 0)' }], { duration: 300, easing: 'ease-in', fill: 'forwards' });
    setTimeout(() => el.remove(), 320);

}

/* ---------- lower third ---------- */
function renderLower() {

  if (L.camCarIdx !== lastCam) { lastCam = L.camCarIdx; camShownAt = Date.now(); }
  let on = S.show.lowerthird && !!car && (LAYOUT_MODE || !S.show.board);
  if (on && S.lowerThirdMode === 'oncut') on = Date.now() - camShownAt < 8000;
  show('lower', on);
  if (!car) return;
  if (VIS.lower && VIS.lower.on && $('lName').dataset.idx && $('lName').dataset.idx !== String(car.idx)) {
    $('lower').classList.remove('mc'); lowerMcAt = Date.now() + 550;
    anim(q('lower', '.nm'), wipeIn, { duration: 500 }); anim(q('lower', '.n'), wipeIn, { duration: 400 }); shineOn(q('lower', '.nm'), 250);
  }

  if (car.lastStr) parts.push(`<span><b>LAST</b>${esc(car.lastStr)}</span>`);
  if (car.bestStr) parts.push(`<span><b>BEST</b>${esc(car.bestStr)}</span>`);
  if (isQual()) {   // qualifying: the pole time everyone is chasing
    const pole = (L.cars || []).filter(c => c.best > 0).sort((a, b) => a.best - b.best)[0];

function renderLowerQual(car) {
  const box = $('lQ');
  const q = isQual() ? car.qual : null, done = isQual() ? car.qualDone : null;
  let label = '', value = '', cls = '';
  if (done) {                                   // just crossed the line: lap time and the position it gives them
    label = 'LAP TIME · P' + car.pos; value = done.time.toFixed(3); cls = 'done' + (done.improved ? ' best' : '');
  } else if (q && q.hot) {
    if (q.delta == null) { label = 'FLYING LAP'; value = '—'; }
    else {
      label = 'TO POLE' + (q.proj ? ' · PACE P' + q.proj : '');
      value = (q.delta < 0 ? '−' : '+') + Math.abs(q.delta).toFixed(3);
      cls = q.delta < 0 ? 'ahead' : 'behind';

  box.hidden = !label;

/* ---------- penalty box: shown when Show is pressed in the live timing window; 8 seconds each, queued ---------- */
const PN = { seen: new Map(), queue: [], cur: null, until: 0, next: 0, hide: null, ready: false };
const PN_SHOW = 8000;
function renderPenalty() {
  const P = PEN || {}, list = P.list || [], now = Date.now();
  if (LAYOUT_MODE) {
    $('pnNum').textContent = '42'; $('pnName').textContent = 'R. CARTER'; $('pnPos').textContent = 'P5'; $('pnWhy').textContent = 'SPEEDING';
    show('penalty', true); return;
  }
  for (const ev of list) {   // Show pressed for a penalty: queue it
    if (PN.seen.get(ev.id) === ev.show) continue;
    PN.seen.set(ev.id, ev.show);
    if (!ev.show || !PN.ready) continue;
    if (PN.cur === ev.id) PN.until = now + PN_SHOW;   // pressed again while it's up: keep it up longer
    else if (!PN.queue.includes(ev.id)) PN.queue.push(ev.id);
  }
  if (PN.hide === null) PN.hide = P.hide;
  if (P.hide !== PN.hide) { PN.hide = P.hide; PN.queue = []; if (PN.cur) { PN.cur = null; PN.next = now + 900; } }
  PN.ready = true;
  if (PN.cur && now >= PN.until) { PN.cur = null; PN.next = now + 900; }
  if (!PN.cur && PN.queue.length && now >= PN.next) {
    PN.cur = PN.queue.shift(); PN.until = now + PN_SHOW;
  }
  const ev = list.find(e => e.id === PN.cur);
  if (PN.cur && !ev) PN.cur = null;
  if (ev) {
    $('pnNum').textContent = ev.num;
    $('pnName').textContent = tickerName(ev.name);
    $('pnPos').textContent = ev.pos ? 'P' + ev.pos : '';
    if ($('pnWhy').textContent !== (ev.reason || '')) $('pnWhy').textContent = ev.reason || '';   // picked live in the timing window
  }
  show('penalty', !!ev);

  anim(q('grid', '.gline'), [{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: 400, delay: 200, easing: 'ease-in', fill: 'forwards' });
  anim(q('grid', '.gbar'), [{ clipPath: 'inset(0 0 0 0)' }, { clipPath: 'inset(0 50% 0 50%)' }], { duration: 500, delay: 250, easing: EASE_IN, fill: 'forwards' });
  return 800;
};
/* Grid self-check: on the broadcast PC the pole sitter's car render once stayed invisible except while it was
   animating (Oct 25; fine in a normal browser here). A couple of seconds after the Grid or the Pole Award changes,
   check that both car renders are really on screen, and if one isn't, write what was covering or hiding it to the log. */
function gridCheck(why) {
  setTimeout(() => {
    if (!(VIS.grid && VIS.grid.on) || AW.on || document.hidden) return;
    const info = side => {
      const s = q('grid', '.gside.' + side), car = s.querySelector('.gcar'), img = car.querySelector('img'), gin = s.querySelector('.gin');
      if (s.classList.contains('empty') || !img.getAttribute('src') || img.classList.contains('none')) return null;
      const r = car.getBoundingClientRect();
      if (!r.width || !r.height) return null;       // not laid out (a page in the background, e.g. a browser tab): nothing to judge
      const top = document.elementFromPoint(r.x + r.width / 2, r.y + r.height / 2);
      const cs = getComputedStyle(car), gs = getComputedStyle(gin);
      return { ok: (+cs.opacity > 0.5) && cs.visibility !== 'hidden' && (!top || car.contains(top) || top.classList.contains('shine')), top: top ? (top.tagName + '.' + top.className) : 'none', op: cs.opacity, vis: cs.visibility,
               ginClip: gs.clipPath, ginOp: gs.opacity, ginTf: gs.transform, anims: s.getAnimations({ subtree: true }).length,
               img: img.complete + '/' + img.naturalWidth, rect: [r.x, r.y, r.width, r.height].map(Math.round).join(',') };
    };
    const g = $('grid'); g.classList.add('hit');      // the overlay ignores the mouse; let the check "see" the grid
    const l = info('l'), r = info('r');
    g.classList.remove('hit');
    if ((l && !l.ok) || (r && !r.ok))
      try { navigator.sendBeacon('/api/clientlog', JSON.stringify({ page: 'overlay', msg: 'Grid car render not visible after ' + why + ': ' + JSON.stringify({ left: l, right: r }) + ' ua ' + navigator.userAgent })); } catch (e) {}
  }, 2600);
}
/* Pole Award: shown on Row 1 when Show Pole Award is pressed; Next row (or anything that leaves Row 1) takes it away */
const AW = { on: false };
function gridAward() {
  const w = (RAW && RAW.gridw) || {}, pa = w.pole || {}, file = ((RAW && RAW.sponsor) || {}).files ? RAW.sponsor.files.pole || '' : '';
  if (file && $('gawImg').dataset.f !== file) { $('gawImg').dataset.f = file; $('gawImg').src = '/sponsor/' + file; }
  const want = !LAYOUT_MODE && !!pa.on && !!file && GR.on && GR.row === 0 && GR.shownRow === 0 && !!(VIS.grid && VIS.grid.on);
  if (want) GR.at = Date.now();            // automatic mode waits on Row 1 while the award is up
  if (want && !AW.on) awardIn(); else if (!want && AW.on) { awardOut(); gridCheck('Pole Award off'); }
  const up = !!(VIS.grid && VIS.grid.on);
  if (up && !AW.wasUp) gridCheck('Grid shown');
  AW.wasUp = up;
}
function awardIn() {
  AW.on = true;
  const g = $('grid'), side = q('grid', '.gside.l'), rect = side.querySelector('.gframe rect');
  side.querySelectorAll('.gwash, .gframe, .gaw, .gaw *, .gcar').forEach(e => e.getAnimations().forEach(a => a.cancel()));
  $('gPole').style.left = $('gpL').offsetLeft + 'px';
  g.classList.add('aw');
  anim($('gPole'), [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: 380 });
  anim(side.querySelector('.gwash'), [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], { duration: 550, delay: 200 });
  anim(rect, [{ strokeDasharray: '100', strokeDashoffset: '100' }, { strokeDasharray: '100', strokeDashoffset: '0' }], { duration: 750, delay: 200, fill: 'both' });
  g.classList.add('awcar');      // the car render fades out (CSS transition, see #grid.awcar)
  anim($('gawImg'), [{ opacity: 0, transform: 'scale(.55)' }, { opacity: 1, transform: 'scale(1.08)', offset: .7 }, { opacity: 1, transform: 'scale(1)' }], { duration: 550, delay: 600, easing: 'cubic-bezier(.2,.8,.3,1)' });
  anim(side.querySelector('.gawc'), wipeIn, { duration: 450, delay: 900 });
  shineOn(side.querySelector('.gaw'), 1000);
}
function awardOut() {
  AW.on = false;
  const g = $('grid'), side = q('grid', '.gside.l');
  const fade = [{ opacity: 1 }, { opacity: 0 }];
  // the badge shrinks away first, then the award panel fades and the car render comes back (about half a second, like the other exits)
  anim($('gPole'), [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.8)' }], { duration: 350, easing: EASE_IN, fill: 'forwards' });
  [side.querySelector('.gaw'), side.querySelector('.gwash'), side.querySelector('.gframe')].forEach(e => anim(e, fade, { duration: 400, delay: 120, easing: 'ease-in', fill: 'forwards' }));
  side.querySelector('.gcar').getAnimations().forEach(a => a.cancel());
  setTimeout(() => { if (!AW.on) g.classList.remove('awcar'); }, 250);   // the car render fades back in (CSS transition)
  setTimeout(() => { if (AW.on) return; g.classList.remove('aw'); side.querySelectorAll('.gwash, .gframe, .gaw, .gaw *').forEach(e => e.getAnimations().forEach(a => a.cancel())); $('gPole').getAnimations().forEach(a => a.cancel()); }, 560);
}
function renderGrid() {
  const w = (RAW && RAW.gridw) || {};
  const grid = (L && L.grid) || [];
  const rows = Math.ceil(grid.length / 2);
  $('gSite').textContent = w.site ?? 'vspeedsim.com';
  if (LAYOUT_MODE) { if (GR.shownRow !== 0) gridShowRow(grid, 0, false); GR.on = true; show('grid', grid.length > 0); return; }
  const on = !!w.visible && rows > 0;
  const now = Date.now();
  if (on && (!GR.on || w.t !== GR.t)) {          // (re)start from row 1
    GR.on = true; GR.t = w.t; GR.row = 0; GR.at = now; GR.step = w.step && w.step.n;
    if (VIS.grid && VIS.grid.on) gridShowRow(grid, 0, true); else { gridShowRow(grid, 0, false); show('grid', true); }
    return;
  }
  if (!on) { if (GR.on) { GR.on = false; show('grid', false); } return; }
  const manual = w.mode === 'manual';
  if (w.step && w.step.n !== GR.step) {           // Prev / Next row from the panel
    GR.step = w.step.n;
    if (manual && w.step.dir > 0 && GR.row + 1 >= rows) {   // Next on the last row: same as the end of the auto cycle
      if (w.end === 'loop') { GR.row = 0; GR.at = now; gridShowRow(grid, 0, true); }
      else { GR.on = false; show('grid', false); post_('/api/settings', { gridw: { visible: false } }); }
      return;
    }
    const to = Math.max(0, Math.min(rows - 1, GR.row + (w.step.dir < 0 ? -1 : 1)));
    if (to !== GR.row) { GR.row = to; gridShowRow(grid, GR.row, true); }
    GR.at = now; return;
  }
  if (!manual && now - GR.at >= Math.max(2, +w.rowSec || 6) * 1000) {
    GR.at = now;
    if (GR.row + 1 >= rows) {
      if (w.end === 'loop') { GR.row = 0; gridShowRow(grid, 0, true); }
      else { GR.on = false; show('grid', false); post_('/api/settings', { gridw: { visible: false } }); }
      return;
    }
    GR.row++; gridShowRow(grid, GR.row, true); return;
  }
  if (GR.shownRow === GR.row) {                   // keep names / times fresh without animating
    const a = grid[GR.row * 2], b = grid[GR.row * 2 + 1];
    if (a) gridFill('l', a); if (b) gridFill('r', b);
  }
}
function post_(url, body) { return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).catch(() => {}); }

/* ---------- Layout: every widget can be moved and resized from the control panel ----------
   Each widget has an anchor point (where it sits by default) and is drawn at
   translate(...) scale(...) so that anchor lands on its saved spot at its saved size.
   Settings: layout = { id: { x, y, s } }  (x, y = anchor on screen, s = size multiplier). */
const LAYOUT_MODE = new URLSearchParams(location.search).has('layout');
const WIDGETS = {
  gfx:       { name: 'Track graphic',  el: 'gfx',        from: [960, 540] },
  logo:      { name: 'VSPEED logo',    el: 'logo',       from: [40, 30] },
  league:    { name: 'League + tag',   el: 'league',     from: [1880, 30] },
  tower:     { name: 'Ticker',         el: 'tower',      from: [40, 120] },
  lower:     { name: 'Driver info',    el: 'lower',      from: [420, 1040] },
  board:     { name: 'Results',        el: 'board',      from: [960, 120] },
  movers:    { name: 'Biggest movers', el: 'movers',     from: [1880, 1040] },
  nextrace:  { name: 'Next broadcast', el: 'nextrace',   from: [960, 998] },
  penalty:   { name: 'Penalty box',    el: 'penalty',    from: [960, 34] },
  grid:      { name: 'Grid',           el: 'grid',       from: [960, 1010] },
  standings: { name: 'Standings',      el: 'fStandings', from: [80, 100],   to: [410, 170],   s: 0.82, frame: true },
  info:      { name: 'Race info',      el: 'fAnalysis',  from: [1840, 960], to: [1880, 1040], s: 0.70, frame: true },
  team:      { name: 'Broadcast team', el: 'fTeam',      from: [995, 1000], to: [880, 1040], s: 0.72, frame: true },
};
// native widgets get a full-screen holder that carries the layout transform (the widget keeps its own show/hide animation)
for (const id in WIDGETS) {
  const w = WIDGETS[id], el = $(w.el);
  w.to = w.to || w.from.slice(); w.s = w.s || 1;
  if (w.frame) { w.holder = el; continue; }
  const h = document.createElement('div');
  h.className = 'holder';
  el.parentNode.insertBefore(h, el);
  h.appendChild(el);
  w.holder = h;
}
const XF = {};   // current transform of each widget: { tx, ty, s, x, y, mult }
function applyLayout() {
  const lay = (RAW && RAW.layout) || {};
  for (const id in WIDGETS) {
    const w = WIDGETS[id], o = lay[id] || {};
    const x = o.x ?? w.to[0], y = o.y ?? w.to[1], mult = o.s ?? 1, sc = w.s * mult;
    const tx = x - w.from[0] * sc, ty = y - w.from[1] * sc;
    XF[id] = { tx, ty, s: sc, x, y, mult };
    const t = `translate(${tx}px, ${ty}px) scale(${sc})`;
    if (w.holder.style.transform !== t) w.holder.style.transform = t;
  }
}
// on-screen rectangle of a widget (in 1920x1080 overlay pixels)
const FRAME_EL = { fAnalysis: 'analysis', fTeam: 'team' };
function rectOf(id) {
  const w = WIDGETS[id];
  try {
    if (id === 'gfx') return gfxRect();
    if (!w.frame) {
      const r = $(w.el).getBoundingClientRect();
      return { x: r.left, y: r.top, w: r.width, h: r.height };
    }
    const doc = $(w.el).contentDocument;
    let inner = FRAME_EL[w.el];
    if (!inner) inner = (SD && SD.state && SD.state.view === 'bracket' && !LAYOUT_MODE) ? 'bracket' : 'panel';
    const el = doc && doc.getElementById(inner);
    if (!el) return null;
    let r = el.getBoundingClientRect();
    if (inner === 'panel' || inner === 'bracket') {           // include the rows below the header bar
      const kids = [...el.querySelectorAll('#head, #cols, #bhead, #bcols')].map(k => k.getBoundingClientRect()).filter(k => k.height);
      if (kids.length) {
        const top = Math.min(...kids.map(k => k.top)), bot = Math.max(...kids.map(k => k.bottom));
        r = { left: r.left, top: Math.min(r.top, top), width: r.width, height: Math.max(bot, r.bottom) - Math.min(r.top, top) };
      }
    }
    const f = XF[id];
    return { x: f.tx + r.left * f.s, y: f.ty + r.top * f.s, w: r.width * f.s, h: r.height * f.s };
  } catch (e) { return null; }
}
const hits = (a, b) => a && b && a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
// for the control panel's Layout tab
window.layoutInfo = () => {
  const out = {};
  for (const id in WIDGETS) out[id] = { name: WIDGETS[id].name, rect: rectOf(id), x: XF[id].x, y: XF[id].y, mult: XF[id].mult };
  return out;
};

/* ---------- standings / race info / team: embedded pages + ducking ----------
   The embedded pages animate themselves (they poll /state). While one is on screen, any
   live-race graphic it overlaps steps aside, and comes back after it has animated out. */
const origin = encodeURIComponent(location.origin);
$('fStandings').src = '/standings?control=' + origin;
$('fAnalysis').src = '/analysis?align=right&control=' + origin;
$('fTeam').src = '/team?control=' + origin;
const duck = { standings: 0, info: 0, team: 0, gfx: 0, grid: 0, nextrace: 0 };   // time until which each is considered on screen
function onScreen() {
  const st = (SD && SD.state) || {}, now = Date.now();
  if (st.visible) duck.standings = now + 1500;
  if (st.analysis && st.analysis.visible) duck.info = now + 1500;
  if (st.team && st.team.visible) duck.team = now + 1700;
  if (G.on) duck.gfx = now + 900;
  if (GR.on) duck.grid = now + 1100;
  if (RAW && RAW.show && RAW.show.nextrace) duck.nextrace = now + 1100;
  return Object.keys(duck).filter(k => duck[k] > now);
}
// after the program is updated (it restarts with a new version) the page reloads itself, so the browser input in
// the broadcasting software runs the new version without being refreshed by hand
let pageVer = null;
function newVersion(d) {
  const v = d && d.app && d.app.version; if (!v) return false;
  if (pageVer === null) pageVer = v;
  if (v === pageVer) return false;
  location.reload(); return true;
}
const SHOW_KEY = { logo: 'logo', league: 'league', tower: 'tower', lower: 'lowerthird', flag: 'flags', board: 'board', movers: 'movers' };

/* ---------- layout mode (/overlay?layout=1): everything on screen with sample data, for positioning ---------- */
function sampleLive() {
  const names = ['Ryan Carter','Jake Morrison','Tyler Brooks','Cody Hensley','Austin Reed','Mason Pike','Dylan Hart','Chase Whitaker','Brandon Cole','Logan Fisher',
                 'Evan Sutton','Kyle Barrett','Nate Delgado','Garrett Lowe','Hunter Vance','Jordan Mills','Cole Ramsey','Blake Turner','Trent Hollis','Wyatt Doyle'];
  const cars = names.map((n, i) => ({ idx: i + 1, num: String((i * 37 + 3) % 99), name: n, pos: i + 1, classPos: i + 1, cls: '', gap: i ? '+' + (i * 0.4).toFixed(1) : 'LEADER',
    interval: i ? '+0.4' : 'LEADER', classGap: '', classInterval: '', onTrack: true, pit: false, lastStr: '29.812', bestStr: '29.640', car: 'Next Gen Camaro' }));
  return { connected: true, source: 'sample', track: 'Sample Speedway', sessionName: 'RACE', isRace: true, sessionState: 4, lap: 12, totalLaps: 60,
           flag: 'green', cars, classes: [], camCarIdx: 1, camGroups: [], isReplay: false,
           grid: cars.map((c, i) => ({ pos: i + 1, idx: c.idx, num: c.num, name: c.name, car: 'NASCAR Chevrolet Camaro ZL1', time: (33.5 + i * 0.031).toFixed(3), img: '' })) };
}
function layoutForce() {
  const fr = (id) => { try { return $(id).contentWindow; } catch (e) { return null; } };
  const sw = fr('fStandings'), aw = fr('fAnalysis'), tw = fr('fTeam');
  try { if (sw && sw.setView && !sw.document.getElementById('panel').classList.contains('show')) sw.setView('standings'); } catch (e) {}
  try { if (aw && aw.aShow && aw.document.getElementById('analysis').style.visibility !== 'visible') aw.aShow(); } catch (e) {}
  try { if (tw && tw.tShow && tw.document.getElementById('team').style.visibility !== 'visible') tw.tShow(); } catch (e) {}
}
if (LAYOUT_MODE) setInterval(layoutForce, 1500);

function render() {
  if (!RAW || !L) return;
  applyLayout();
  const base = RAW.show, vis = Object.assign({}, base);
  if (LAYOUT_MODE) {
    Object.values(SHOW_KEY).forEach(k => vis[k] = true);
  } else {
    const up = onScreen().map(rectOf);
    for (const id in SHOW_KEY) {
      if (up.length && base[SHOW_KEY[id]] && up.some(r => hits(r, rectOf(id)))) vis[SHOW_KEY[id]] = false;
    }
  }
  if (sponsorLive(RAW)) vis.lowerthird = false;   // driver info steps aside while a sponsor graphic is up
  if (podiumWant()) {   // the podium artwork has its own VSPEED logo and covers the screen: the other graphics step aside
    ['logo', 'tower', 'lowerthird', 'movers', 'board', 'pitrace'].forEach(k => vis[k] = false);
  }
  S = Object.assign({}, RAW, { show: vis }, LAYOUT_MODE ? { lowerThirdMode: 'always' } : {});
  const realL = L;
  if (LAYOUT_MODE && !(L.connected && L.cars && L.cars.length)) L = sampleLive();
  renderChrome(); renderTower(); renderLower(); renderBoard(); renderMovers(); renderNext(); renderPitrace(); renderPodium(); renderGfx(); renderGrid(); gridAward(); renderSponsor(); renderPenalty();
  if (LAYOUT_MODE && FLAG_BANNERS) { const fl = $('flag'); Object.keys(FLAG_TEXT).forEach(k => fl.classList.toggle(k, k === 'green')); $('flagText').textContent = 'GREEN FLAG'; show('flag', true); } else renderFlag();
  L = realL;
}
setInterval(render, 1000); // keeps time-based things (on-cut lower third, ducking) moving

function connect() {
  const es = new EventSource('/events');
  es.onmessage = e => { const d = JSON.parse(e.data); if (newVersion(d)) return; RAW = d.settings; L = d.live; SD = d.standings; PEN = d.penalties; PR = d.pitrace || PR; render(); };
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}
connect();
