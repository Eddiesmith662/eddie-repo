# GLR HUB, the GLR league site: results, standings, schedules and stewarding, at glrhub.app.
# vspeedlivetiming.app/glr (its first address) still reaches it: pages forward to glrhub.app, and overlays and race
# control on older versions are answered there directly.
# Deployed by Cloudflare (Workers Builds) from this folder of the repo, separately from the announcer relay.
# Secrets (the Discord sign-in settings) are set in the Cloudflare dashboard, never here.
name = "vspeed-glr"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
keep_vars = true          # leave settings saved in the Cloudflare dashboard alone on deploy
# only the /glr part of the domain: the announcer relay keeps everything else
# (a route takes precedence over the relay's custom domain on the same hostname)
routes = [
  { pattern = "glrhub.app", custom_domain = true },
  { pattern = "vspeedlivetiming.app/glr*", zone_name = "vspeedlivetiming.app" },
]

[[d1_databases]]
binding = "DB"
database_name = "vspeed-glr"
database_id = "a35dfdd8-fb45-411c-a3c8-d81c725df849"

# every 5 minutes: retry Discord posts that are waiting (Discord down, or asked us to slow down)
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
