# VSPEED announcer relay. Deployed by Cloudflare (Workers Builds) from this folder of the repo.
# The CHANNEL_SECRET secret is set in the Cloudflare dashboard, never here.
name = "vspeed-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true     # the old *.workers.dev address keeps working too
# the relay's own address (the domain is in the same Cloudflare account; Cloudflare makes the certificate)
routes = [{ pattern = "vspeedlivetiming.app", custom_domain = true }]
preview_urls = false   # one address only: no extra preview copies of the relay

[[durable_objects.bindings]]
name = "CHANNELS"
class_name = "Channel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Channel"]

[observability]
enabled = true

# the announcer page is a plain HTML file, bundled as text
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
